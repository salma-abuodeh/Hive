<div class="mainapp">
  <aside class="sidebar">
    <p class="logo">Hive</p>

    <nav>
      <a routerLink="/dashboard">Dashboard</a>
      <a routerLink="/community">Community</a>
      <a routerLink="/notifications">Notifications</a>
      @if (auth.canManageUsers()) {
        <a routerLink="/users">Users</a>
      }
    </nav>
  </aside>

  <div class="page-area">
<header class="topbar">
  <div class="topbar-left">
    <img src="/logo/HiveLogo.png" alt="Hive Logo" class="topbar-logo" />
    <h2>Hive</h2>
  </div>

      <div class="topbar-right">
        <span><a routerLink="/dashboard">Dashboard</a></span>
        <a routerLink="/community">Community</a>
        <span><a routerLink="/notifications">Notifications</a></span>
        <span><a routerLink="/profile">Profile</a></span>
        @if (auth.canManageUsers()) {
          <a routerLink="/users">Users</a>
        }
        <span><button (click)="logout()">Logout</button></span>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
