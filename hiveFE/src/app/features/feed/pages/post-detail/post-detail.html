<section class="detail">
  <a routerLink="/feed" class="back">← Back to feed</a>

  @if (error()) {
    <div class="notice error" role="alert">{{ error() }}</div>
  }

  @if (loading()) {
    <p class="loading-label">Loading post…</p>
  } @else if (post(); as current) {
    <app-post-card
      [post]="current"
      [editing]="editing"
      [saving]="busy()"
      [teams]="myTeams()"
      [companyName]="companyName()"
      [autoExpandComments]="true"
      (edit)="onEdit($event)"
      (cancelEdit)="cancelEdit()"
      (saveEdit)="onSaveEdit($event)"
      (remove)="onDelete($event)"
      (react)="onReact($event)"
      (saveToggle)="onSaveToggle($event)"
      (share)="onShare()"
      (attachmentsChanged)="onAttachmentsChanged($event)"
      (commentCountChanged)="onCommentCountChanged($event)"
    />
  }
</section>
