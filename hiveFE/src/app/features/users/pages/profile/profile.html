<div class="profile-page">
    <mat-card class="profile-card">
      <h2>Profile</h2>
  
      @if (loading()) {
        <p>Loading...</p>
      } @else {
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>First name</mat-label>
          <input matInput [(ngModel)]="firstName" />
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Last name</mat-label>
          <input matInput [(ngModel)]="lastName" />
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="email" />
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New password (optional)</mat-label>
          <input matInput type="password" [(ngModel)]="password" />
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Current password (required to change email/password)</mat-label>
          <input matInput type="password" [(ngModel)]="currentPassword" />
        </mat-form-field>
  
        @if (error()) {
          <p class="error">{{ error() }}</p>
        }
        @if (success()) {
          <p class="success">{{ success() }}</p>
        }
  
        <button
          mat-raised-button
          color="primary"
          class="full-width"
          [disabled]="saving()"
          (click)="save()"
        >
          @if (saving()) {
            Saving...
          } @else {
            Save
          }
        </button>
      }
    </mat-card>
  </div>
