<div class="form-head">
  <h2>Sign in to Hive</h2>
  <p>Enter your details to access your workspace.</p>
</div>

<form (ngSubmit)="login()">
  <div class="field">
    <label for="email">Email address</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
      placeholder="you@company.com"
      autocomplete="email"
      required
    >
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >
  </div>

  <div class="row-between">
    <label class="checkbox-row">
      <input type="checkbox" name="remember">
      Remember me
    </label>
    <a href="#" class="forgot">Forgot password?</a>
  </div>

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <button class="btn btn-primary" type="submit" [disabled]="loading() || !email || !password">
    {{ loading() ? 'Signing in…' : 'Sign In' }}
  </button>
</form>

<div class="divider">or continue with</div>

<div class="social-row">
  <button type="button" class="btn btn-social" disabled>
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <path fill="#EA4335" d="M9 3.6c1.3 0 2.5.45 3.4 1.3l2.5-2.5C13.4.9 11.3 0 9 0 5.5 0 2.5 2 1 5l2.9 2.3C4.6 5 6.6 3.6 9 3.6z"/>
      <path fill="#4285F4" d="M17.6 9.2c0-.6-.05-1.1-.15-1.7H9v3.3h4.8c-.2 1.1-.9 2-1.9 2.6l2.9 2.3c1.7-1.6 2.8-3.9 2.8-6.5z"/>
      <path fill="#FBBC05" d="M3.9 10.7c-.2-.6-.3-1.1-.3-1.7s.1-1.1.3-1.7L1 5C.4 6.2 0 7.6 0 9s.4 2.8 1 4l2.9-2.3z"/>
      <path fill="#34A853" d="M9 18c2.4 0 4.5-.8 5.9-2.2l-2.9-2.3c-.8.5-1.8.9-3 .9-2.4 0-4.4-1.4-5.1-3.7L1 12.9C2.5 16 5.5 18 9 18z"/>
    </svg>
    Google
  </button>
  <button type="button" class="btn btn-social" disabled>
    <svg width="18" height="18" viewBox="0 0 18 18" fill="#3d1c05" aria-hidden="true">
      <path d="M13.5 9.6c0-1.6.9-2.5 1-2.6-.5-.8-1.4-1.3-2.3-1.4-1-.1-1.9.6-2.4.6-.5 0-1.2-.6-2-.6-1 0-2 .6-2.5 1.5-1.1 1.9-.3 4.7.8 6.2.5.7 1.1 1.6 1.9 1.5.8 0 1.1-.5 2-.5.9 0 1.2.5 2 .5.8 0 1.4-.7 1.9-1.5.6-.9.8-1.7.9-1.8-.1 0-1.3-.5-1.3-1.9zM11.9 4.2c.4-.5.7-1.2.6-1.9-.6 0-1.4.4-1.8.9-.4.4-.7 1.1-.6 1.8.7.1 1.4-.3 1.8-.8z"/>
    </svg>

</div>

<p class="foot-note">Don't have an account? <a routerLink="/signup">Create one</a></p>
