<header class="app-header">
  <div class="header-search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/>
      <path d="M21 21l-4.3-4.3"/>
    </svg>
    <input type="text" placeholder="Search Hive…" readonly>
  </div>
  <div class="header-actions">
    <a class="icon-btn" routerLink="/notifications" title="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
        <path d="M6 9a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6z"/>
        <path d="M10 20a2 2 0 004 0"/>
      </svg>
      <span class="badge-dot"></span>
    </a>
    <a class="user-menu" routerLink="/profile">
      <div class="hex-frame hex">{{ userInitials() }}</div>
      <div class="user-meta">
        <strong>{{ displayName() }}</strong>
        <span>{{ roleLabel() }}</span>
      </div>
    </a>
  </div>
</header>
