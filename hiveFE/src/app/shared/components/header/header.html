<header class="app-header">
  <div class="header-search">
    <app-icon name="search" />
    <input type="text" placeholder="Search Hive…" readonly>
  </div>
  <div class="header-actions">
    <a class="icon-btn" routerLink="/notifications" title="Notifications">
      <app-icon name="notifications" />
      <span class="badge-dot"></span>
    </a>
    <a class="user-menu" routerLink="/profile">
      <div class="hex-frame hex">{{ userInitials() }}</div>
      <div class="user-meta">
        <strong>{{ displayName() }}</strong>
        <span>{{ roleLabel() }}</span>
      </div>
    </a>
  </div>
</header>
