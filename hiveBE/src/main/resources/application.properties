spring.application.name=hive

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hive}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
app.jwt.secret=4f8c9d2a7b1e5c6f9a0d3b7e2c8f1a6d5b9c3e7f2a4d8c1b6e9f0a2d7c5b3e1
app.jwt.issuer=Sakinni
app.jwt.access-expiration-minutes=45
app.jwt.refresh-expiration-days=7
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG