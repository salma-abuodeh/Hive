spring.application.name=hive

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hive}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
app.jwt.secret=${JWT_SECRET:hive-local-dev-jwt-secret-change-me-32chars-min}
app.jwt.issuer=hive
app.jwt.access-expiration-minutes=45
app.jwt.refresh-expiration-days=7
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.storage.local.base-dir=${STORAGE_BASE_DIR:./uploads}